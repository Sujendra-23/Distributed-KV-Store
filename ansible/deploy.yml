---
# Provisions Docker on every host in the cluster, then deploys the storage
# node image on storage_nodes and the coordinator image on the coordinator
# host, pulling the addresses of every storage node into the coordinator's
# startup command automatically.
- name: Provision Docker runtime
  hosts: kvstore_cluster
  become: true
  tasks:
    - name: Install Docker prerequisites
      apt:
        name: [ca-certificates, curl, gnupg]
        state: present
        update_cache: true

    - name: Add Docker's official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker Engine
      apt:
        name: [docker-ce, docker-ce-cli, containerd.io]
        state: present
        update_cache: true

    - name: Ensure Docker is running
      systemd:
        name: docker
        state: started
        enabled: true

- name: Deploy storage nodes
  hosts: storage_nodes
  become: true
  tasks:
    - name: Pull the kvstore-node image
      docker_image:
        name: kvstore-node:latest
        source: pull

    - name: Run the storage node container
      docker_container:
        name: kv-node
        image: kvstore-node:latest
        command: "-addr=:{{ node_port }}"
        ports:
          - "{{ node_port }}:{{ node_port }}"
        restart_policy: always
        state: started

- name: Deploy coordinator
  hosts: coordinator
  become: true
  vars:
    # Build the -nodes flag from every storage node's inventory host + port,
    # e.g. "10.0.1.11:7001,10.0.1.12:7001,10.0.1.13:7001"
    node_list: "{{ groups['storage_nodes'] | map('extract', hostvars, 'ansible_host') | zip(groups['storage_nodes'] | map('extract', hostvars, 'node_port')) | map('join', ':') | join(',') }}"
  tasks:
    - name: Pull the kvstore-coordinator image
      docker_image:
        name: kvstore-coordinator:latest
        source: pull

    - name: Run the coordinator container
      docker_container:
        name: kv-coordinator
        image: kvstore-coordinator:latest
        command: "-http=:8080 -nodes={{ node_list }}"
        ports:
          - "8080:8080"
        restart_policy: always
        state: started
