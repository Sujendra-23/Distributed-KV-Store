apiVersion: v1
kind: Namespace
metadata:
  name: kvstore
---
apiVersion: v1
kind: Service
metadata:
  name: kv-node
  namespace: kvstore
spec:
  clusterIP: None   # headless: gives each pod a stable DNS name (kv-node-0.kv-node, ...)
  selector:
    app: kv-node
  ports:
    - port: 7001
      name: grpc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kv-node
  namespace: kvstore
spec:
  serviceName: kv-node
  replicas: 3
  selector:
    matchLabels: { app: kv-node }
  template:
    metadata:
      labels: { app: kv-node }
    spec:
      containers:
        - name: kv-node
          image: kvstore-node:latest
          imagePullPolicy: IfNotPresent
          args: ["-addr=:7001"]
          ports:
            - containerPort: 7001
          resources:
            requests: { cpu: "100m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            tcpSocket: { port: 7001 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 7001 }
            initialDelaySeconds: 5
            periodSeconds: 10
