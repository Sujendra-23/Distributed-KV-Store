apiVersion: apps/v1
kind: Deployment
metadata:
  name: kv-coordinator
  namespace: kvstore
spec:
  replicas: 1
  selector:
    matchLabels: { app: kv-coordinator }
  template:
    metadata:
      labels: { app: kv-coordinator }
    spec:
      containers:
        - name: kv-coordinator
          image: kvstore-coordinator:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-http=:8080"
            # StatefulSet pods get stable DNS: <pod-name>.<service-name>.<namespace>.svc.cluster.local
            - "-nodes=kv-node-0.kv-node.kvstore.svc.cluster.local:7001,kv-node-1.kv-node.kvstore.svc.cluster.local:7001,kv-node-2.kv-node.kvstore.svc.cluster.local:7001"
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: "100m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /status, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kv-coordinator
  namespace: kvstore
spec:
  type: ClusterIP
  selector:
    app: kv-coordinator
  ports:
    - port: 8080
      targetPort: 8080
