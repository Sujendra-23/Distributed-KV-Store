version: "3.9"

services:
  node1:
    build: { context: ., dockerfile: Dockerfile.node }
    command: ["-addr=:7001"]
    ports: ["7001:7001"]

  node2:
    build: { context: ., dockerfile: Dockerfile.node }
    command: ["-addr=:7002"]
    ports: ["7002:7002"]

  node3:
    build: { context: ., dockerfile: Dockerfile.node }
    command: ["-addr=:7003"]
    ports: ["7003:7003"]

  coordinator:
    build: { context: ., dockerfile: Dockerfile.coordinator }
    command: ["-http=:8080", "-nodes=node1:7001,node2:7002,node3:7003"]
    ports: ["8080:8080"]
    depends_on: [node1, node2, node3]
